<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>{{ sitename }}</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="container p-2">
        <div class="p-4 bg-danger-subtle text-white rounded">
            <a href="{{ url_for('index') }}">
                <h1 class="text-light"><span class="text-danger-emphasis">&#9982;</span> {{ sitename }}</h1>
            </a>
        </div>
    </header>


    <nav class="=container px-2">
        <div class="navbar navbar-expand-sm navbar-dark bg-dark rounded">
            <div class="container-fluid">
                <a class="navbar-brand" href="javascript:void(0)">Logo</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mynavbar">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="javascript:void(0)">Link</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="javascript:void(0)">Link</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="javascript:void(0)">Link</a>
                        </li>
                    </ul>
                    <form class="d-flex">
                        <input class="form-control me-2" type="text" placeholder="Search">
                        <button class="btn btn-primary" type="button">Search</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="container pt-2 px-2">
        <div class="bg-light rounded p-3 flew-grow-1">
            alguma coisa
            {% block content %}
            {% endblock %}
        </div>
    </main>


    <footer class="container mt-2 mb-2 px-2">
        <div class=" bg-dark text-light p-3 rounded text-center"> &copy; 2026 {{ sitename }}</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</body>

</html>
